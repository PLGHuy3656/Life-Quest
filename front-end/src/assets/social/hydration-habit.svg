      <stop offset="0%" stop-color="#E8F7F5"/>
      <stop offset="60%" stop-color="#F2FAF8"/>
      <stop offset="100%" stop-color="#E4F2F7"/>
    </linearGradient>
    <linearGradient id="hh-water" x1="0" y1="60" x2="0" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6DD0C4"/>
      <stop offset="100%" stop-color="#168C78"/>
    </linearGradient>
  </defs>

  <rect width="360" height="180" rx="14" fill="url(#hh-bg)"/>
  <circle cx="290" cy="40" r="46" fill="#C4ECE6" opacity="0.5"/>
  <circle cx="62" cy="148" r="38" fill="#F6C85F" opacity="0.22"/>

