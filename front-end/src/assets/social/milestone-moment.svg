<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" fill="none">
  <defs>
    <linearGradient id="mm-sky" x1="0" y1="0" x2="360" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAF7F3"/>
      <stop offset="55%" stop-color="#F6F3EA"/>
      <stop offset="100%" stop-color="#FCECE1"/>
    </linearGradient>
    <linearGradient id="mm-hill1" x1="0" y1="90" x2="360" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9DFD2"/>
      <stop offset="100%" stop-color="#87C4B0"/>
    </linearGradient>
    <linearGradient id="mm-hill2" x1="60" y1="115" x2="360" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5DAE95"/>
      <stop offset="100%" stop-color="#168C78"/>
    </linearGradient>
  </defs>

  <rect width="360" height="180" rx="14" fill="url(#mm-sky)"/>

  <!-- Warm morning sun -->
  <circle cx="286" cy="46" r="24" fill="#F6C85F" opacity="0.32"/>
  <circle cx="286" cy="46" r="15" fill="#F6C85F" opacity="0.88"/>

  <!-- Soft clouds -->
  <rect x="38" y="30" width="52" height="14" rx="7" fill="#FFFFFF" opacity="0.82"/>
  <rect x="52" y="24" width="28" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>

  <!-- Rolling milestone hills -->
  <path d="M0 132C58 102 118 110 184 86C244 64 300 76 360 108V180H0V132Z" fill="url(#mm-hill1)"/>
  <path d="M0 150C76 130 142 138 214 114C274 94 322 104 360 124V180H0V150Z" fill="url(#mm-hill2)"/>

  <!-- Winding progress trail with milestone dots -->
  <path d="M52 162C96 144 130 146 160 120C180 102 192 94 204 76" stroke="#FFF9EE" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 6"/>
  <circle cx="88" cy="148" r="6" fill="#FFFFFF" stroke="#168C78" stroke-width="2.5"/>
  <circle cx="152" cy="128" r="6" fill="#FFFFFF" stroke="#168C78" stroke-width="2.5"/>

  <!-- Summit flag -->
  <g transform="translate(198, 36)">
    <rect x="6" y="6" width="3.5" height="44" rx="1.75" fill="#16324A"/>
    <path d="M9.5 8H40L32 18L40 28H9.5V8Z" fill="#F26B3A"/>
    <circle cx="21" cy="18" r="3" fill="#FFFDF8"/>
  </g>

  <!-- Milestone checklist card floating -->
  <g transform="translate(36, 62)">
    <rect width="106" height="58" rx="12" fill="#FFFFFF" opacity="0.94"/>
    <circle cx="18" cy="19" r="6" fill="#168C78"/>
    <path d="M15.2 19L17.2 21L21 17" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="16" width="58" height="5.5" rx="2.75" fill="#16324A" opacity="0.8"/>

    <circle cx="18" cy="39" r="6" fill="#F26B3A"/>
    <path d="M15.2 39L17.2 41L21 37" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="36" width="46" height="5.5" rx="2.75" fill="#4D6274" opacity="0.55"/>
  </g>

  <!-- Celebratory sparkles -->
  <path d="M192 34L194.2 39.8L200 42L194.2 44.2L192 50L189.8 44.2L184 42L189.8 39.8L192 34Z" fill="#F6C85F"/>
  <circle cx="210" cy="28" r="3" fill="#F26B3A" opacity="0.65"/>
  <circle cx="268" cy="78" r="3.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
