<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" fill="none">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="360" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF4E6"/>
      <stop offset="55%" stop-color="#FCEBDA"/>
      <stop offset="100%" stop-color="#F6DFC9"/>
    </linearGradient>
    <radialGradient id="sc-sun" cx="0.22" cy="0.24" r="0.55">
      <stop offset="0%" stop-color="#FFE4A3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE4A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sc-desk" x1="0" y1="126" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5B88B"/>
      <stop offset="100%" stop-color="#D4A070"/>
    </linearGradient>
  </defs>

  <!-- Cozy warm background -->
  <rect width="360" height="180" rx="14" fill="url(#sc-bg)"/>
  <rect width="360" height="180" rx="14" fill="url(#sc-sun)"/>

  <!-- Arched sunlit window -->
  <path d="M40 128V54C40 31.9 57.9 14 80 14C102.1 14 120 31.9 120 54V128H40Z" fill="#FFFDF8" opacity="0.88"/>
  <path d="M80 14V128M40 72H120" stroke="#F0D9C0" stroke-width="2.5"/>
  <circle cx="96" cy="44" r="11" fill="#F6C85F" opacity="0.85"/>

  <!-- Soft botanical leaves top-right -->
  <path d="M352 8C330 22 318 42 314 66" stroke="#6FA88E" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="322" cy="30" rx="13" ry="6" transform="rotate(-28 322 30)" fill="#89BDA4"/>
  <ellipse cx="337" cy="46" rx="12" ry="5.5" transform="rotate(18 337 46)" fill="#6FA88E"/>
  <ellipse cx="315" cy="54" rx="11" ry="5" transform="rotate(-14 315 54)" fill="#A4CFB9"/>

  <!-- Wooden desk surface -->
  <rect x="0" y="126" width="360" height="54" fill="url(#sc-desk)"/>
  <rect x="0" y="126" width="360" height="4" fill="#F1CCA4" opacity="0.7"/>

  <!-- Open notebook -->
  <g transform="translate(114, 92)">
    <rect x="4" y="34" width="128" height="10" rx="5" fill="#B58254" opacity="0.28"/>
    <path d="M6 12C6 7.6 9.6 4 14 4H66V40H14C9.6 40 6 36.4 6 32V12Z" fill="#FFFFFF" stroke="#E2D5C5" stroke-width="1.5"/>
    <path d="M66 4H118C122.4 4 126 7.6 126 12V32C126 36.4 122.4 40 118 40H66V4Z" fill="#FFFDF9" stroke="#E2D5C5" stroke-width="1.5"/>
    <rect x="18" y="13" width="34" height="4" rx="2" fill="#F26B3A" opacity="0.78"/>
    <rect x="18" y="22" width="38" height="3.5" rx="1.75" fill="#CBD5DE"/>
    <rect x="18" y="29" width="26" height="3.5" rx="1.75" fill="#CBD5DE"/>
    <circle cx="80" cy="15" r="3.5" fill="#168C78"/>
    <rect x="88" y="13.2" width="26" height="3.5" rx="1.75" fill="#9BB3C4"/>
    <circle cx="80" cy="25" r="3.5" fill="#168C78"/>
    <rect x="88" y="23.2" width="22" height="3.5" rx="1.75" fill="#9BB3C4"/>
    <circle cx="80" cy="34" r="3.5" fill="#F6C85F"/>
    <rect x="88" y="32.2" width="18" height="3.5" rx="1.75" fill="#CBD5DE"/>
  </g>

  <!-- Steaming terracotta mug -->
  <g transform="translate(262, 92)">
    <ellipse cx="18" cy="40" rx="18" ry="4" fill="#B58254" opacity="0.28"/>
    <rect x="4" y="14" width="28" height="25" rx="7" fill="#F26B3A"/>
    <path d="M32 19H36C39.3 19 42 21.7 42 25C42 28.3 39.3 31 36 31H32" stroke="#F26B3A" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M12 9C12 6 15 6 15 3" stroke="#E09D7C" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M21 9C21 6 24 6 24 3" stroke="#E09D7C" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Tiny potted succulent -->
  <g transform="translate(52, 95)">
    <ellipse cx="16" cy="37" rx="14" ry="3.5" fill="#B58254" opacity="0.28"/>
    <path d="M6 21H26L23 36H9L6 21Z" fill="#D98B5F"/>
    <ellipse cx="16" cy="14" rx="5.5" ry="9" fill="#168C78"/>
    <ellipse cx="10" cy="16" rx="4.5" ry="7.5" transform="rotate(-24 10 16)" fill="#3CA791"/>
    <ellipse cx="22" cy="16" rx="4.5" ry="7.5" transform="rotate(24 22 16)" fill="#3CA791"/>
  </g>

  <!-- Minimalist warm desk lamp -->
  <g transform="translate(200, 34)">
    <path d="M18 92V44L34 26" stroke="#8F6A4A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 22L44 14L48 30L28 34L24 22Z" fill="#F26B3A"/>
    <ellipse cx="38" cy="34" rx="14" ry="5" fill="#FFE4A3" opacity="0.55"/>
    <rect x="6" y="90" width="24" height="5" rx="2.5" fill="#8F6A4A"/>
  </g>

  <!-- Subtle sparkles -->
  <path d="M158 38L160.2 43.8L166 46L160.2 48.2L158 54L155.8 48.2L150 46L155.8 43.8L158 38Z" fill="#F6C85F"/>
  <circle cx="140" cy="60" r="3" fill="#F26B3A" opacity="0.45"/>
</svg>
